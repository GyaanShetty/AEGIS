[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["SpendPolicyModule", "AgentAccount", "AttestationVerifier"]
fs_permissions = [{ access = "read", path = "./" }]

# Poseidon2 in pure Solidity is ~10M gas/payment, so the default fuzz/invariant
# budgets are modest. Deep fuzzing (make fuzz) raises runs; for very high run
# counts switch the module to the Yul Poseidon2 variant (see docs/benchmarks).
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
