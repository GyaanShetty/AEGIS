[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["SpendPolicyModule", "AgentAccount", "AttestationVerifier"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
runs = 512
depth = 100
fail_on_revert = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
